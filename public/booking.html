<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Szczegóły rezerwacji</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <script type="module" src="/assets/booking.js"></script>
</head>
<body>
  <main class="staff-layout">
    <section class="booking-card" aria-labelledby="page-title">
      <h1 id="page-title">Szczegóły rezerwacji</h1>
      <p id="error" class="error" role="alert" hidden></p>
      <p id="loading" role="status">Sprawdzamy rezerwację…</p>
      <div id="booking" hidden>
        <p id="booking-status" role="status"></p>
        <p id="booking-number"></p>
        <p id="shop-name"></p>
        <p id="rental-period"></p>
        <p id="rental-items"></p>
        <div class="total-line"><span>Przedpłata</span><strong id="rental-total"></strong></div>
        <p id="refund-explanation" hidden><span id="refund-label"></span> <strong id="refund-total" data-testid="cancellation-refund"></strong></p>
        <details>
          <summary>Zaakceptowane warunki najmu</summary>
          <p id="terms"></p>
          <p id="accepted-at"></p>
          <p id="cancellation-cutoff"></p>
        </details>
        <form id="cancel-booking" hidden>
          <p>Ta operacja anuluje całą rezerwację.</p>
          <button type="submit">Anuluj całą rezerwację</button>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
