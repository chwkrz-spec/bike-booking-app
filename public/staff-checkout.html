<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-en="Pay for your booking">Opłać rezerwację</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <script type="module" src="/assets/staff-checkout.js"></script>
</head>
<body>
  <main class="booking-layout">
    <section class="booking-card" aria-labelledby="page-title">
      <p id="shop-name" class="shop-name"></p>
      <p id="shop-description" hidden></p>
      <h1 id="page-title" data-en="Pay for your booking">Opłać rezerwację</h1>
      <p id="error" class="error" role="alert" hidden></p>
      <div id="checkout-summary" hidden>
        <p id="booking-period"></p>
        <ul id="booking-items"></ul>
        <div class="total-line"><span data-en="Amount due">Do zapłaty</span><strong id="total"></strong></div>
      </div>
      <p id="checkout-status" role="status"></p>
      <p id="checkout-deadline" class="deadline" hidden><span data-en="Time left to pay ">Czas na płatność </span><time id="hold-deadline"></time></p>
      <form id="staff-renter-details" hidden>
        <div id="rider-heights"></div>
        <details open>
          <summary data-en="Rental terms">Warunki najmu</summary>
          <p id="terms"></p>
        </details>
        <label class="checkbox"><input name="acceptedTerms" type="checkbox" required><span data-en=" I accept the rental terms"> Akceptuję warunki najmu</span></label>
        <button type="submit" data-en="Pay">Zapłać</button>
      </form>
      <a id="payment-link" class="button" hidden data-en="Continue to payment">Przejdź do płatności</a>
      <a id="booking-link" class="button" hidden data-en="View booking">Zobacz rezerwację</a>
    </section>
    <aside class="seller-card" id="seller" aria-labelledby="seller-title" hidden>
      <h2 id="seller-title" data-en="Seller">Sprzedawca</h2>
      <strong id="seller-name"></strong>
      <p id="seller-address"></p>
      <p id="seller-nip"></p>
    </aside>
  </main>
</body>
</html>
