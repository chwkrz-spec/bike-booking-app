<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-en="Payment simulator">Symulator płatności</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <script type="module" src="/assets/payment.js"></script>
</head>
<body>
  <main class="single-layout">
    <section class="booking-card" aria-labelledby="page-title">
      <h1 id="page-title" data-en="Payment simulator">Symulator płatności</h1>
      <p data-en="This is a test payment. No money will be charged.">Transakcja testowa bez pobierania środków.</p>
      <p id="error" class="error" role="alert" hidden></p>
      <p id="payment-status" role="status"></p>
      <section id="payment" hidden>
        <p class="deadline"><span data-en="Time left to pay ">Czas na płatność </span><time id="payment-deadline"></time></p>
        <div class="total-line"><span data-en="Amount due">Do zapłaty</span><strong id="total"></strong></div>
        <button id="pay" type="button" data-en="Simulate payment">Zasymuluj płatność</button>
      </section>
      <a href="/" id="back" hidden data-en="Return to booking widget">Wróć do widżetu</a>
    </section>
  </main>
</body>
</html>
