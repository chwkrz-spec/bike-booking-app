<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Symulator płatności</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <script type="module" src="/assets/payment.js"></script>
</head>
<body>
  <main class="single-layout">
    <section class="booking-card" aria-labelledby="page-title">
      <h1 id="page-title">Symulator płatności</h1>
      <p>Transakcja testowa bez pobierania środków.</p>
      <p id="error" class="error" role="alert" hidden></p>
      <p id="payment-status" role="status"></p>
      <section id="payment" hidden>
        <p class="deadline">Czas na płatność <time id="payment-deadline"></time></p>
        <div class="total-line"><span>Do zapłaty</span><strong id="total"></strong></div>
        <button id="pay" type="button">Zasymuluj płatność</button>
      </section>
      <a href="/" id="back" hidden>Wróć do widżetu</a>
    </section>
  </main>
</body>
</html>
