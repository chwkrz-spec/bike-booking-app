<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rezerwacje punktu</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <script type="module" src="/assets/staff.js"></script>
</head>
<body>
  <main class="staff-layout">
    <section class="booking-card" aria-labelledby="page-title">
      <h1 id="page-title">Rezerwacje punktu</h1>
      <p id="error" class="error" role="alert" hidden></p>
      <p id="empty" hidden>Brak potwierdzonych rezerwacji.</p>
      <div class="table-container" id="list" hidden>
        <table>
          <thead>
            <tr>
              <th scope="col">Termin</th>
              <th scope="col">Sprzęt</th>
              <th scope="col">Kontakt</th>
              <th scope="col">Wzrost</th>
              <th scope="col">Przedpłata</th>
              <th scope="col">Status</th>
            </tr>
          </thead>
          <tbody id="reservations"></tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
